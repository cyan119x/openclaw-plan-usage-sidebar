name: Bug report
description: Report a reproducible problem with the patch.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: openclaw-version
    attributes:
      label: OpenClaw version and commit
      placeholder: v2026.9.3 / 1391f7c
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Describe the installation and exact actions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove tokens, account emails, and other private data before posting.
